# fly.toml app configuration file generated for yumankh-cipher on 2026-11-21T19:05:44Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'yumankh-cipher'
primary_region = 'dfw'

[build]
[deploy]
  release_command = 'npx prisma migrate deploy'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
